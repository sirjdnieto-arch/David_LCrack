name: Prueba Telegram

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de prueba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          payload = json.dumps({
              "chat_id": chat_id,
              "text": "✅ David LCrack: prueba de conexión correcta. Este es un mensaje de prueba, no una señal."
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise ValueError()
              print("Mensaje de prueba enviado correctamente.")
          except Exception:
              print("No se pudo enviar. Revisa los secretos y que hayas iniciado el bot.")
              raise SystemExit(1)
          PY
